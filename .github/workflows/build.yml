name: Build AstOs ROM

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'mods/**'
      - '.github/workflows/playback-preview.yml'
  # nightly rebuild is opt-in via workflow_dispatch only —
  # full ROM builds are heavy.

permissions:
  contents: write
  actions: write

concurrency:
  group: rom-build
  cancel-in-progress: true

jobs:
  companion:
    name: AstOS Companion (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove merged fix branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/fix/setup-connectivity-pc-playback" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/fix/setup-connectivity-pc-playback"
          fi

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Set up Java 17 (codec interop test)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up .NET 8 (real audio analyzer)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build audio analyzer
        shell: bash
        run: dotnet publish companion/audio-helper/AstAudio.csproj -c Release -o companion/resources/audio

      - name: Install + test
        shell: bash
        working-directory: companion
        run: |
          npm ci --no-audit --no-fund
          npm test
          python ../tests/static33.py
          python ../tests/ui34.py
          bash ../scripts/test-ai.sh
          npx electron test/renderer-smoke.js

      # adb for the USB transport — bundled into resources/adb
      - name: Fetch adb (platform-tools)
        shell: bash
        working-directory: companion
        run: |
          mkdir -p resources/adb
          curl -sL -o /tmp/pt.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          unzip -j -o /tmp/pt.zip 'platform-tools/adb.exe' 'platform-tools/AdbWinApi.dll' 'platform-tools/AdbWinUsbApi.dll' -d resources/adb
          ls -la resources/adb

      - name: Build installers (electron-builder)
        shell: bash
        working-directory: companion
        run: |
          npx electron-builder --win nsis portable --x64 --publish never
          ls -la dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-win
          path: |
            companion/dist/AstOS-Companion-Setup-*.exe
            companion/dist/AstOS-Companion-Portable-*.exe
          if-no-files-found: error

  build:
    name: AstOs ROM (TB3-710F)
    needs: companion
    runs-on: ubuntu-latest
    timeout-minutes: 340   # stay under the 6 h per-job cap

    env:
      ROMDIR: /mnt/rom
      CCACHE_DIR: /mnt/ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          echo "CPUs: $(nproc)"
          free -h
          df -h / /mnt || true

      - name: Free disk space
        run: bash scripts/10-free-disk.sh

      # Build-time accelerator: ccache (kernel, bionic, frameworks/native,
      # ...) + the Gradle/JDK toolchain are persisted between runs. The
      # first run stays as-is; every later run gets a warm head start.
      - name: Restore build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /mnt/ccache
            /home/runner/gradle-8.7
            /home/runner/.gradle
            /home/runner/jdk17
          key: astos-caches-v1-${{ github.run_id }}
          restore-keys: |
            astos-caches-v1-

      # v3.1: the Windows installer built by the companion job — attached
      # to the same release as the ROM zip.
      - name: Fetch companion installer
        uses: actions/download-artifact@v4
        with:
          name: companion-win
          path: companion-win

      - name: Prepare host build deps
        run: bash scripts/05-prepare-host.sh

      - name: Sync LineageOS 14.1 source
        run: bash scripts/20-sync-source.sh
        env:
          REPO_ROOT: ${{ github.workspace }}

      - name: Build AstShell app
        run: bash scripts/30-build-astshell.sh
        env:
          REPO_ROOT: ${{ github.workspace }}

      - name: Embed AstOs into ROM tree
        run: bash scripts/40-embed-astos.sh
        env:
          REPO_ROOT: ${{ github.workspace }}

      - name: Build ROM
        run: bash scripts/50-build-rom.sh
        env:
          REPO_ROOT: ${{ github.workspace }}

      - name: Publish release
        run: bash scripts/60-release.sh
        env:
          REPO_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}
          COMPANION_DIR: ${{ github.workspace }}/companion-win

      - name: Save build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /mnt/ccache
            /home/runner/gradle-8.7
            /home/runner/.gradle
            /home/runner/jdk17
          key: astos-caches-v1-${{ github.run_id }}
