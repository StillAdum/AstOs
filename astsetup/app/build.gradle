plugins {
    id 'com.android.application'
}

android {
    namespace 'com.astos.setup'
    compileSdk 34

    defaultConfig {
        applicationId "com.astos.setup"
        minSdk 24
        targetSdk 25
        versionCode 2
        versionName "2.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Platform-signed by the ROM build (LOCAL_CERTIFICATE := platform)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // QR code generation for the phone-pairing step
    implementation 'com.google.zxing:core:3.4.1'
}
