plugins {
    id 'com.android.application'
}

android {
    namespace 'com.astos.setup'
    compileSdk 34

    defaultConfig {
        applicationId "com.astos.setup"
        minSdk 24
        targetSdk 25
        versionCode 5
        versionName "3.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Platform-signed by the ROM build (LOCAL_CERTIFICATE := platform)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // pixel fonts stay uncompressed
    androidResources {
        noCompress 'ttf'
    }

    // v3.1: the shared AstLink companion protocol (Bluetooth SPP + USB),
    // compiled into both apps from one source tree.
    sourceSets {
        main {
            java {
                srcDir '../../astlink/src/main/java'
            }
        }
    }
}

dependencies {
    // QR code generation for the phone-pairing step
    implementation 'com.google.zxing:core:3.4.1'
}
